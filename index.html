<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>wrongfirst</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
  <link rel="shortcut icon" href="./favicon/favicon.ico">
  <link rel="manifest" href="./favicon/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <script type="speculationrules">
    {
      "prefetch": [
        {
          "where": {
            "and": [
              { "href_matches": "/*/" },
              { "not": { "href_matches": "/favicon/*" } }
            ]
          },
          "eagerness": "moderate"
        }
      ]
    }
  </script>
</head>

<body>
  <header class="top-bar">
    <a href="./" id="site-title-link" class="top-brand">
      <span class="top-brand-logo" aria-hidden="true">
        <svg class="top-brand-logo-svg" viewBox="0 0 64 64" width="20" height="20" aria-hidden="true">
          <path d="M32 3.5A28.5 28.5 0 0 0 32 60.5Z" fill="#fe4a46"/>
          <path d="M32 3.5A28.5 28.5 0 0 1 32 60.5Z" fill="#66ed5b"/>
          <circle cx="32" cy="32" r="28.5" fill="none" stroke="#242424" stroke-width="3.5"/>
          <rect x="12.75" y="30.5" width="12.75" height="3" fill="#242424"/>
          <rect x="38.5" y="30.5" width="12.75" height="3" fill="#242424"/>
          <rect x="43.375" y="25.625" width="3" height="12.75" fill="#242424"/>
        </svg>
      </span>
      <h1 id="site-title" class="site-title">wrongfirst</h1>
    </a>
  </header>

  <div class="layout-container">
    <section class="page-intro">
      <p id="site-subtitle" class="site-subtitle">a collection of programming exercises you can solve from your browser</p>
    </section>

    <div id="continue-container" class="continue-container" hidden></div>

    <main id="content-container" class="content-container">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading directory...</p>
      </div>
    </main>

    <footer class="site-footer">
      <span><a href="https://github.com/wrongfirst" target="_blank" rel="noopener noreferrer">Look under the hood</a></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>

</html>
